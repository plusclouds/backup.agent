# backup-agent Configuration
#
# This file is written once by `backup-agent register --token=... --endpoint=...`
# — the platform's registration response is the source of truth for nats/bucket/
# access_key below (see docs/backup.agent/registration.md). Values here after
# registration are for reference/hand-editing only; re-registering overwrites them.
# All values can also be overridden by environment variables
# (prefix: PLUSCLOUDS_BACKUP_AGENT_).

nats:
  connection_type: nats
  url: "nats://nats.example.com:4222"

  # Written by `register` from the registration response.
  agent_uuid: ""
  api_key: ""

  max_reconnects: -1
  reconnect_wait: 5s

bucket:
  name: ""
  endpoint: ""

access_key:
  access_key: ""
  secret_key: ""

agent:
  heartbeat_interval: 30s
  telemetry_interval: 60s
  state_file: /var/lib/plusclouds/backup-agent-state.json
  kopia_cache_dir: /var/lib/plusclouds/backup-agent-kopia-cache
  work_dir: /var/lib/plusclouds/backup-agent-work

log:
  level: info
  format: json
  file: /var/log/plusclouds/backup-agent.log

# Optional: local connection settings for job_type "database" jobs, keyed by
# engine (postgres, mysql, mssql) then connection name ("default" unless the
# job names another). Credentials stay here — the platform never sees them.
# With nothing configured the agent uses each engine's own local defaults
# (client defaults for Postgres/MySQL, Windows integrated auth for SQL Server).
# See docs/backup.agent/updates/2026-11-16-database-jobs.md.
#
# databases:
#   mssql:
#     default:
#       host: localhost
#       port: 1433
#       instance: ""          # named instance, e.g. SQLEXPRESS
#       user: ""              # empty = Windows integrated auth
#       password: ""
#       dump_dir: 'D:\StashDumps'   # writable by the SQL Server service account
#   postgres:
#     default: { host: localhost, port: 5432, user: postgres, password: "" }
#   mysql:
#     default: { host: 127.0.0.1, port: 3306, user: backup, password: "", bin_dir: "" }
